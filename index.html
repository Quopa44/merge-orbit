:root {
  --bg: #120d33;
  --bg2: #1d1550;
  --ink: #1a0f45;
  --ink2: #0b0626;
  --panel: #2b2078;
  --panel2: #3b2d9c;
  --line: #5543d6;
  --text: #ffffff;
  --muted: #bdb4ff;
  --yellow: #ffd23f;
  --orange: #ff9f1c;
  --pink: #ff5fa2;
  --cyan: #3fe0ff;
  --green: #5be37d;
  --violet: #9b6bff;
  --red: #ff5a5f;
  --display: 'MO Black', system-ui, sans-serif;
  --bold: 'MO Bold', system-ui, sans-serif;
  --body: 'MO Semi', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; position: relative; overflow: hidden; background: var(--bg); color: var(--text);
  font: 600 15px/1.35 var(--body); user-select: none; -webkit-user-select: none; overscroll-behavior: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { font: inherit; color: inherit; user-select: text; -webkit-user-select: text; }
svg { display: block; }
#bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.screen {
  position: absolute; inset: 0; display: none; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen.active { display: block; animation: screenIn .28s ease-out; }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
.col { width: 100%; max-width: 560px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

/* ----- sticker type ----- */
.title {
  margin: 0; font-family: var(--display); font-weight: 900; color: #fff; letter-spacing: .01em; line-height: 1; text-wrap: balance;
  text-shadow: -.06em -.06em 0 var(--ink), .06em -.06em 0 var(--ink), -.06em .06em 0 var(--ink), .06em .06em 0 var(--ink),
    0 -.08em 0 var(--ink), 0 .08em 0 var(--ink), -.08em 0 0 var(--ink), .08em 0 0 var(--ink), 0 .16em 0 var(--ink2);
}
.title.y { color: var(--yellow); }
.muted { color: var(--muted); }

/* ----- buttons ----- */
.btn {
  position: relative; border: 3px solid var(--ink); border-radius: 20px; padding: 13px 18px; font-family: var(--bold); font-weight: 800;
  background: linear-gradient(#8a73ff, #5a3fe0); color: #fff; text-shadow: 0 2px 0 rgba(26, 15, 69, .55);
  box-shadow: 0 6px 0 var(--ink), inset 0 3px 0 rgba(255, 255, 255, .38); transition: transform .08s, box-shadow .08s, filter .15s;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink), inset 0 3px 0 rgba(255, 255, 255, .38); }
.btn:disabled { filter: grayscale(.8) brightness(.7); cursor: default; }
.btn.yellow { background: linear-gradient(#ffe56f, #ffb01f); color: #3a2300; text-shadow: 0 2px 0 rgba(255, 255, 255, .45); }
.btn.green { background: linear-gradient(#86f5a0, #2fc760); color: #06361a; text-shadow: 0 2px 0 rgba(255, 255, 255, .4); }
.btn.pink { background: linear-gradient(#ff8cc3, #ff4a93); }
.btn.red { background: linear-gradient(#ff8286, #e8363c); }

.round {
  width: 48px; height: 48px; flex: none; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 3px solid var(--ink);

.bar { display: flex; align-items: center; gap: 12px; flex: none; }

/* ----- loading ----- */

.pulse { animation: pulse 1.1s ease-in-out infinite; }

/* ----- menu ----- */
#s-menu .col { gap: 12px; }
.menu-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; }
.menu-head { text-align: center; padding-top: 4px; flex: none; }
.menu-head .title { font-size: clamp(34px, 9vw, 52px); }

  display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 16px 12px 12px; border: 3px solid var(--ink); border-radius: 28px; width: 100%;

.planet.p3 { background: radial-gradient(circle at 35% 30%, #dfffb0, #5be37d 55%, #1f9a55); }

.mini { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 20px; border: 3px solid var(--ink); background: linear-gradient(#41349f, #2b2078); box-shadow: 0 5px 0 var(--ink), inset 0 3px 0 rgba(255, 255, 255, .22); font-family: var(--bold); font-weight: 800; font-size: 12px; position: relative; }

/* ----- worlds ----- */
.world-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; flex: none; }
.wt { padding: 8px 4px 6px; border-radius: 18px; border: 3px solid var(--ink); background: linear-gradient(#41349f, #2b2078); display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--bold); font-weight: 800; font-size: 11px; box-shadow: 0 4px 0 var(--ink); position: relative; }

.wt:disabled { filter: grayscale(.9) brightness(.65); cursor: default; }
.wt .planet { width: 34px; height: 34px; box-shadow: inset -4px -4px 0 rgba(0, 0, 0, .22), inset 3px 3px 0 rgba(255, 255, 255, .35); }

.world-info p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

.level-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 8px; align-content: center; max-height: 430px; }
.lv { border-radius: 16px; border: 3px solid var(--ink); background: linear-gradient(#8a73ff, #5a3fe0); font-family: var(--display); font-weight: 900; font-size: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 4px 0 var(--ink), inset 0 3px 0 rgba(255, 255, 255, .3); padding: 0; min-height: 0; text-shadow: 0 2px 0 rgba(26, 15, 69, .6); }

.lv:disabled { background: #2a2270; filter: none; color: #6f66c9; box-shadow: 0 3px 0 var(--ink); text-shadow: none; cursor: default; }

/* ----- game ----- */
#s-game { padding-block: 8px; }
.g-top { display: flex; align-items: center; gap: 10px; flex: none; }
.g-title { flex: 1; min-width: 0; font-family: var(--display); font-weight: 900; font-size: 16px; line-height: 1.1; text-wrap: balance; }
.g-title small { display: block; font-family: var(--bold); font-weight: 800; font-size: 11px; color: var(--muted); margin-top: 2px; }
.g-stat { text-align: center; padding: 4px 12px 5px; border-radius: 16px; border: 3px solid var(--ink); background: var(--panel); box-shadow: 0 4px 0 var(--ink); min-width: 74px; flex: none; }
.g-stat small { display: block; font-family: var(--bold); font-weight: 800; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.g-stat b { font-family: var(--display); font-weight: 900; font-size: 19px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.g-goal { flex: none; display: grid; gap: 5px; }
.g-goal p { margin: 0; font-family: var(--bold); font-weight: 800; font-size: 14px; min-height: 19px; }
.hpbar { height: 16px; border-radius: 999px; border: 3px solid var(--ink); background: var(--ink2); overflow: hidden; box-shadow: 0 3px 0 var(--ink); }
.hpbar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(#ffe56f, #ffb01f); transition: width .3s; }
.hpbar i.boss { background: linear-gradient(#ff8286, #e8363c); }
.hpbar i.hot { background: linear-gradient(#ff9f1c, #e8363c); }
.g-info { flex: none; margin: 0; min-height: 17px; font-size: 12px; font-family: var(--bold); font-weight: 800; color: var(--muted); text-align: center; }
.g-board { flex: 1; min-height: 0; display: grid; place-items: center; }
.stage { position: relative; border-radius: 30px; overflow: hidden; border: 3px solid var(--ink); background: #150f42; box-shadow: 0 6px 0 var(--ink); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.coach { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 3; padding: 10px 14px; border-radius: 18px; border: 3px solid var(--ink); background: #fff; color: #2a1d66; font-family: var(--bold); font-weight: 800; font-size: 14px; box-shadow: 0 4px 0 var(--ink); text-align: center; animation: pop .25s ease-out; }
.coach b { font-family: var(--display); font-weight: 900; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.g-tools { display: grid; grid-template-columns: repeat(3, minmax(0, .8fr)) minmax(0, 1.5fr); gap: 8px; flex: none; padding-bottom: 6px; }
.tool { padding: 8px 4px 9px; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 18px; }
.tool svg { width: 22px; height: 22px; }
.tool[aria-pressed="true"] { background: linear-gradient(#ffe56f, #ffb01f); color: #3a2300; text-shadow: none; }
.nova { flex-direction: row; justify-content: center; gap: 8px; overflow: hidden; isolation: isolate; background: #2b2078; font-size: 14px; }
.nova::before { content: ""; position: absolute; inset: 0; z-index: -1; width: calc(var(--p, 0) * 100%); background: linear-gradient(90deg, #7a62ff, #ff5fa2); transition: width .3s; }
.nova.ready { background: #2b2078; animation: glow 1s ease-in-out infinite alternate; }
.nova.ready::before { background: linear-gradient(90deg, #ffe56f, #ff9f1c); }
.nova.ready { color: #3a2300; text-shadow: none; }
@keyframes glow { from { filter: brightness(1); } to { filter: brightness(1.25); } }

/* ----- modals ----- */
.modal { position: absolute; inset: 0; z-index: 20; display: none; place-items: center; padding: 16px; background: rgba(8, 4, 30, .78); backdrop-filter: blur(3px); }
.modal.open { display: grid; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: min(100%, 420px); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 12px; text-align: center; animation: pop .25s ease-out; }
.sheet h2 { margin: 0; font-size: 26px; }
.sheet p { margin: 0; color: var(--muted); }
.sheet .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.sheet .row .btn { flex: 1 1 130px; }
.stars-row { display: flex; justify-content: center; gap: 8px; }
.stars-row svg { width: 54px; height: 54px; opacity: .9; }
.stars-row svg.on { animation: starPop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
.stars-row svg.off { filter: grayscale(1) brightness(.45); }
@keyframes starPop { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
.trophy-big { width: 120px; height: 120px; margin: 0 auto; animation: pulse 1.2s ease-in-out infinite; }

/* ----- settings, sliders, toggles ----- */
.set-list { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; padding: 2px 2px 8px; flex: 1; text-align: left; }
.set-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.set-row > span { font-family: var(--bold); font-weight: 800; }
.set-row small { display: block; color: var(--muted); font-family: var(--body); font-weight: 600; font-size: 12px; }
.slider { display: flex; align-items: center; gap: 12px; }
.slider .ico { width: 44px; height: 44px; flex: none; border-radius: 14px; border: 3px solid var(--ink); background: linear-gradient(#41349f, #2b2078); display: grid; place-items: center; box-shadow: 0 3px 0 var(--ink); }
.slider .ico svg { width: 26px; height: 26px; }
.slider .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.slider .mid > span { font-family: var(--bold); font-weight: 800; font-size: 14px; }
.slider .val { min-width: 54px; text-align: center; padding: 4px 8px; border-radius: 12px; border: 3px solid var(--ink); background: var(--ink2); font-family: var(--display); font-weight: 900; font-size: 14px; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; cursor: pointer; --p: 50%; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 18px; border-radius: 999px; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); background: linear-gradient(90deg, var(--cyan), var(--green) calc(var(--p) * .55), var(--yellow) var(--p), transparent var(--p)), var(--ink2); background-clip: padding-box; }
input[type=range]::-moz-range-track { height: 12px; border-radius: 999px; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); background: var(--ink2); }
input[type=range]::-moz-range-progress { height: 12px; border-radius: 999px; background: linear-gradient(90deg, var(--cyan), var(--yellow)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; margin-top: -11px; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 35% 30%, #fff6c4, #ffd23f 45%, #ff9f1c); box-shadow: 0 4px 0 var(--ink); transition: transform .12s; }
input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 35% 30%, #fff6c4, #ffd23f 45%, #ff9f1c); box-shadow: 0 4px 0 var(--ink); }
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.18) rotate(12deg); }
input[type=range]:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; border-radius: 12px; }
.switch { position: relative; width: 62px; height: 36px; flex: none; border-radius: 999px; border: 3px solid var(--ink); background: var(--ink2); padding: 0; box-shadow: 0 3px 0 var(--ink); transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 35% 30%, #fff, #c9c1ff); transition: transform .2s cubic-bezier(.3, 1.5, .5, 1); }
.switch[aria-checked="true"] { background: linear-gradient(#86f5a0, #2fc760); }
.switch[aria-checked="true"]::after { transform: translateX(26px); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 16px; border: 3px solid var(--ink); background: var(--ink2); }
.seg button { border: 0; border-radius: 11px; padding: 8px 6px; background: transparent; font-family: var(--bold); font-weight: 800; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: linear-gradient(#ffe56f, #ffb01f); color: #3a2300; }
.code-box { width: 100%; min-height: 64px; resize: none; border-radius: 14px; border: 3px solid var(--ink); background: var(--ink2); padding: 8px 10px; font: 600 11px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
.cloud-line { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.cloud-line i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.cloud-line i.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }

/* ----- profile / leaders ----- */
.prof-head { display: flex; align-items: center; gap: 12px; }
.av-big { width: 74px; height: 74px; flex: none; }
.name-in { flex: 1; min-width: 0; height: 48px; border-radius: 14px; border: 3px solid var(--ink); background: var(--ink2); padding: 0 12px; font-family: var(--bold); font-weight: 800; font-size: 17px; }
.av-pick { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.av { padding: 2px; border-radius: 14px; border: 3px solid transparent; background: transparent; }

.av svg { width: 100%; height: auto; }
.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 8px 6px; border-radius: 16px; border: 3px solid var(--ink); background: var(--ink2); text-align: center; min-width: 0; }
.stat b { display: block; font-family: var(--display); font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat small { font-size: 11px; color: var(--muted); font-family: var(--bold); font-weight: 800; }
.trophies { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tro { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 11px; font-family: var(--bold); font-weight: 800; }
.tro svg { width: 100%; max-width: 70px; height: auto; }
.tro.off { opacity: .55; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; flex: none; }
.tab { padding: 10px 6px; border-radius: 16px; border: 3px solid var(--ink); background: linear-gradient(#41349f, #2b2078); font-family: var(--bold); font-weight: 800; font-size: 13px; box-shadow: 0 4px 0 var(--ink); }
.tab[aria-selected="true"] { background: linear-gradient(#ffe56f, #ffb01f); color: #3a2300; transform: translateY(-2px); }
.lb { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px 2px 6px; }
.lb-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 8px; border-radius: 18px; border: 3px solid var(--ink); background: linear-gradient(#41349f, #2b2078); flex: none; }
.lb-row.me { background: linear-gradient(#ffe56f, #ffb01f); color: #3a2300; }
.lb-row .rk { width: 28px; text-align: center; font-family: var(--display); font-weight: 900; }
.lb-row .av-s { width: 38px; height: 38px; flex: none; }
.lb-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--bold); font-weight: 800; }
.lb-row .sc { font-family: var(--display); font-weight: 900; font-variant-numeric: tabular-nums; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 300px; padding: 20px 0; }

.toast { position: absolute; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); z-index: 40; opacity: 0; pointer-events: none; padding: 10px 16px; border-radius: 999px; border: 3px solid var(--ink); background: #fff; color: #2a1d66; font-family: var(--bold); font-weight: 800; box-shadow: 0 4px 0 var(--ink); transition: opacity .2s, transform .2s; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-height: 640px) {
  .btn.big { padding: 12px 20px; font-size: 18px; }
  .menu-main { gap: 10px; }
  .planet { width: 50px; height: 50px; }
  .menu-head p { display: none; }
  .g-stat b { font-size: 16px; }
  .tool { padding: 6px 2px 7px; }
}
@media (max-height: 560px) {
  .g-info { display: none; }
  .world-info p { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .screen.active, .modal.open, .sheet, .coach, .pulse, .lv.cur, .nova.ready, .trophy-big, .logo i { animation: none; }
}

<canvas id="bg" aria-hidden="true"></canvas>

  <div class="col">
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
    <h1 class="title y" style="font-size:clamp(38px,11vw,58px)">Merge<br>Orbit</h1>
    <div class="loadbar" id="loadBar"><i id="loadFill"></i></div>
    <div id="loadPct" style="font-family:var(--display);font-weight:900;font-size:30px;text-shadow:0 3px 0 var(--ink);margin-top:-6px" aria-live="polite">0%</div>
    <p class="loadtip" id="loadTip">Загрузка…</p>
    <button class="btn yellow big pulse" id="btnStart" type="button" hidden>Нажми, чтобы играть</button>
  </div>
</section>

<section class="screen" id="s-menu" aria-label="Главное меню">
  <div class="col">
    <div class="menu-top">
      <button class="round" id="mProfile" type="button" aria-label="Профиль"><span id="mAvatar" style="width:36px;height:36px;display:block"></span></button>
      <span class="chipv"><span data-i="trophy" style="width:22px;height:22px;display:block"></span><span id="mTro">0/4</span></span>
      <button class="round" id="mMute" type="button" aria-label="Звук"><span data-i="speaker"></span></button>
    </div>
    <div class="menu-head">
      <h1 class="title y">Merge Orbit</h1>
      <p>Собери свой Млечный Путь</p>
    </div>
    <nav class="menu-main" aria-label="Режимы игры">
      <button class="menu-btn first" id="bEndless" type="button"><span class="planet p1"></span><span class="mb-txt"><b>Бесконечная игра</b><small id="mEndlessSub">Рекорд: 0</small></span></button>
      <button class="menu-btn" id="bWorlds" type="button"><span class="planet p2"></span><span class="mb-txt"><b>Уровни</b><small id="mWorldsSub">Миры и боссы</small></span></button>
      <button class="menu-btn" id="bDaily" type="button"><span class="planet p3"></span><span class="mb-txt"><b>Дневной вызов</b><small id="mDailySub">Один расклад для всех</small></span></button>
    </nav>
    <div class="menu-bottom">
      <button class="mini" id="bTutorial" type="button"><span data-i="book"></span>Обучение<i class="dotnew" id="dotTut" hidden></i></button>
      <button class="mini" id="bProfile" type="button"><span data-i="trophy"></span>Профиль</button>
      <button class="mini" id="bLeaders" type="button"><span data-i="chart"></span>Лидеры</button>
      <button class="mini" id="bSettings" type="button"><span data-i="gear"></span>Настройки</button>
    </div>
  </div>
</section>

<section class="screen" id="s-worlds" aria-label="Карта миров">
  <div class="col">
    <div class="bar">
      <button class="round" id="wBack" type="button" aria-label="Назад"><span data-i="back"></span></button>
      <h2 class="title">Карта миров</h2>
      <span class="chipv"><span data-i="star" style="width:20px;height:20px;display:block"></span><span id="wStars">0</span></span>
    </div>
    <div class="world-tabs" id="wTabs" role="tablist"></div>
    <div class="panel world-info" id="wInfo">
      <span class="planet" id="wPlanet" style="width:48px;height:48px"></span>
      <div class="grow"><h3 id="wName"></h3><p id="wSub"></p></div>
      <span class="chipv" id="wProg"></span>
    </div>
    <div class="level-grid" id="wGrid"></div>
    <p class="g-info" id="wHint"></p>
  </div>
</section>

<section class="screen" id="s-game" aria-label="Игра">
  <div class="col">
    <div class="g-top">
      <button class="round" id="gPause" type="button" aria-label="Пауза"><span data-i="pause"></span></button>
      <div class="g-title"><span id="gTitle"></span><small id="gSub"></small></div>
      <div class="g-stat"><small>Очки</small><b id="gScore">0</b></div>
      <div class="g-stat"><small id="gL3">Рекорд</small><b id="gV3">0</b></div>
    </div>
    <div class="g-goal"><p id="gGoal"></p><div class="hpbar" id="gBarWrap"><i id="gBar"></i></div></div>
    <p class="g-info" id="gInfo"></p>
    <div class="g-board" id="gBoardWrap">
      <div class="stage" id="stage">
        <canvas id="cv" role="img" aria-label="Игровое поле: три вращающихся кольца вокруг ядра"></canvas>
        <div class="coach" id="coach" hidden></div>
      </div>
    </div>
    <div class="g-tools">
      <button class="btn tool dark" id="tUndo" type="button"><span data-i="undo"></span><span id="tUndoL">Отмена</span></button>
      <button class="btn tool dark" id="tPause" type="button" aria-pressed="false"><span data-i="hourglass"></span><span id="tPauseL">Пауза</span></button>
      <button class="btn tool dark" id="tHole" type="button" aria-pressed="false"><span data-i="hole"></span><span id="tHoleL">Дыра</span></button>
      <button class="btn nova" id="tNova" type="button" disabled><span data-i="bolt" style="width:22px;height:22px;display:block"></span><span id="tNovaL">Нова 0/10</span></button>
    </div>
  </div>
</section>

<section class="screen" id="s-settings" aria-label="Настройки">
  <div class="col">
    <div class="bar">
      <button class="round" id="stBack" type="button" aria-label="Назад"><span data-i="back"></span></button>
      <h2 class="title">Настройки</h2>
    </div>
    <div class="panel set-list" id="setBody"></div>
  </div>
</section>

<section class="screen" id="s-profile" aria-label="Профиль">
  <div class="col">
    <div class="bar">
      <button class="round" id="prBack" type="button" aria-label="Назад"><span data-i="back"></span></button>
      <h2 class="title">Профиль</h2>
    </div>
    <div class="panel" style="display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto">
      <div class="prof-head"><span class="av-big" id="prAvatar"></span><input class="name-in" id="prName" maxlength="14" autocomplete="off" aria-label="Имя игрока" placeholder="Твоё имя"></div>
      <div class="av-pick" id="prAvPick"></div>
      <div class="stat-grid" id="prStats"></div>
      <div><p class="muted" style="margin:0 0 8px;font-family:var(--bold);font-weight:800">Трофеи миров</p><div class="trophies" id="prTrophies"></div></div>
    </div>
  </div>
</section>

<section class="screen" id="s-leaders" aria-label="Лидеры">
  <div class="col">
    <div class="bar">
      <button class="round" id="lbBack" type="button" aria-label="Назад"><span data-i="back"></span></button>
      <h2 class="title">Лидеры</h2>
      <button class="round" id="lbRefresh" type="button" aria-label="Обновить"><span data-i="refresh"></span></button>
    </div>
    <div class="tabs" id="lbTabs" role="tablist"></div>
    <div class="lb" id="lbList"></div>
    <p class="g-info" id="lbNote"></p>
  </div>
</section>

<div class="modal" id="m-pause" role="dialog" aria-modal="true" aria-label="Пауза">
  <div class="panel sheet">
    <h2 class="title">Пауза</h2>
    <div class="set-list" id="pauseSet" style="overflow:visible;flex:none"></div>
    <div class="row">
      <button class="btn green big" id="pResume" type="button">Продолжить</button>
    </div>
    <div class="row">
      <button class="btn dark" id="pHelp" type="button">Как играть</button>
      <button class="btn dark" id="pRestart" type="button">Заново</button>
      <button class="btn red" id="pMenu" type="button">В меню</button>
    </div>
  </div>
</div>

<div class="modal" id="m-result" role="dialog" aria-modal="true" aria-label="Итог">
  <div class="panel sheet">
    <h2 class="title y" id="rTitle"></h2>
    <div id="rTrophy" hidden></div>
    <div class="stars-row" id="rStars" hidden></div>
    <p id="rText"></p>
    <div class="row" id="rBtns"></div>
  </div>
</div>

<div class="modal" id="m-confirm" role="alertdialog" aria-modal="true">
  <div class="panel sheet">
    <h2 class="title" id="cTitle" style="font-size:22px"></h2>
    <p id="cText"></p>
    <div class="row"><button class="btn dark" id="cNo" type="button">Отмена</button><button class="btn red" id="cYes" type="button">Да</button></div>
  </div>
</div>

<div class="modal" id="m-card" role="dialog" aria-modal="true">
  <div class="panel sheet">
    <h2 class="title y" id="kTitle" style="font-size:24px"></h2>
    <div id="kArt"></div>
    <p id="kText" style="color:#fff"></p>
    <div class="row"><button class="btn dark" id="kSkip" type="button">Пропустить</button><button class="btn yellow" id="kOk" type="button">Дальше</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
